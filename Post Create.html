<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pint — Post Create</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e3d8; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 100vh; }
  body { padding: 40px 32px 80px; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .row { display: flex; align-items: flex-start; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .row + .row { margin-top: 56px; }
  .row-label {
    text-align: center; margin-bottom: 24px;
    color: #2a2a2a; font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-weight: 700;
    display: flex; align-items: center; gap: 14px; justify-content: center;
  }
  .row-label::before, .row-label::after {
    content: ""; flex: 1; max-width: 200px; height: 1px;
    background: rgba(0,0,0,0.15);
  }
  .frame-label {
    color: #555; font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
    text-align: center; margin-top: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; }
  .intro { max-width: 720px; margin: 0 auto 40px; text-align: center; color: #2a2a2a; }
  .intro h1 { font-size: 36px; margin: 0 0 12px; letter-spacing: -0.03em; font-weight: 800; }
  .intro h1 .dot { color: #d98a14; }
  .intro p { margin: 0; color: #555; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="intro">
  <h1>Post Create<span class="dot">.</span></h1>
  <p>Three-stage flow: aim the dual camera, review what was captured, then write the description and tag drink, place, and audience.</p>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="post-create.jsx"></script>

<script type="text/babel">
  const { PostCreateScreen } = window;

  const stages = [
    { id: "aim",      label: "01 · Aim" },
    { id: "review",   label: "02 · Review" },
    { id: "describe", label: "03 · Describe" },
  ];

  function Showcase() {
    return (
      <React.Fragment>
        <div className="row-label">Dark mode</div>
        <div className="row">
          {stages.map(s => (
            <div key={`d-${s.id}`} className="frame-wrap">
              <PostCreateScreen initialStage={s.id} theme="dark" />
              <div className="frame-label">{s.label}</div>
            </div>
          ))}
        </div>

        <div className="row-label" style={{ marginTop: 64 }}>Light mode (gold accents shift)</div>
        <div className="row">
          {stages.map(s => (
            <div key={`l-${s.id}`} className="frame-wrap">
              <PostCreateScreen initialStage={s.id} theme="light" />
              <div className="frame-label">{s.label}</div>
            </div>
          ))}
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Showcase />);
</script>
</body>
</html>
