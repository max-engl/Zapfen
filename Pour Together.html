<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pint — Pour Together</title>
<style>
  html, body { margin: 0; padding: 0; background: #ece6da; min-height: 100vh; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { -webkit-font-smoothing: antialiased; }
  h1 { text-wrap: balance; }
  /* phone scales down on short viewports so the whole device + stepper stay visible */
  .pt-phone-scale { transform-origin: top center; transition: transform .15s; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pour-together.jsx"></script>
<script type="text/babel" src="pour-together-demo.jsx"></script>

<script>
  // fit the 874px-tall phone into the viewport beneath the header + stepper
  function fitPhone() {
    var el = document.querySelector('.pt-phone-scale');
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.scrollY;
    var avail = window.innerHeight - top - 28;
    var scale = Math.min(1, avail / 874);
    if (scale < 0.45) scale = 0.45;
    el.style.transform = 'scale(' + scale + ')';
    el.style.marginBottom = (874 * scale - 874) + 'px';
  }
  window.addEventListener('resize', fitPhone);
  var __fitTimer = setInterval(fitPhone, 250);
  setTimeout(function () { clearInterval(__fitTimer); }, 3000);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0a0a0a"/>
    <circle cx="42" cy="50" r="15" fill="#3a2410" stroke="#F6B733" stroke-width="2.5"/>
    <circle cx="58" cy="50" r="15" fill="#5a3a1a" stroke="#F6B733" stroke-width="2.5"/>
    <text x="50" y="55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#F6B733" text-anchor="middle">&amp;</text>
  </svg>
</template>
</body>
</html>
