<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pint — Bier-Bingo</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e3d8; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 100vh; }
  body { padding: 40px 32px 80px; }
  .row { display: flex; align-items: flex-start; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .row-label {
    text-align: center; margin-bottom: 24px;
    color: #2a2a2a; font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-weight: 700;
    display: flex; align-items: center; gap: 14px; justify-content: center;
  }
  .row-label::before, .row-label::after {
    content: ""; flex: 1; max-width: 200px; height: 1px; background: rgba(0,0,0,0.15);
  }
  .frame-label {
    color: #555; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
    text-align: center; margin-top: 12px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .intro { text-align: center; max-width: 680px; margin: 0 auto 40px; color: #444; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<div class="intro">
  <h1>Bier-Bingo — Pint.</h1>
  A monthly 5×5 challenge card, shared by everyone and reset each month. Cells auto-complete from the
  user's logged posts. Complete a row, column, or diagonal for a <strong>Zeile</strong>; all 25 is a
  <strong>Blackout</strong>. The compact banner lives on the profile — tap it to open the modal.
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="bingo.jsx"></script>

<script type="text/babel">
  const { BingoModal, BingoBanner, fetchBingoCard } = window;

  function Demo({ theme, startOpen }) {
    const T = window.THEMES[theme];
    const [open, setOpen] = React.useState(startOpen);
    const card = fetchBingoCard();

    return (
      <window.ThemeContext.Provider value={T}>
        <window.IOSDevice width={402} height={874} dark={T.iosDark}>
          <div style={{
            height: "100%", background: T.bg, color: T.text, position: "relative",
            paddingTop: 60, fontFamily: '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif',
          }}>
            {/* faux profile context so the banner reads in-situ */}
            <div style={{ padding: "0 18px 18px" }}>
              <div style={{ color: T.textMuted, fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", marginBottom: 12 }}>Monatliche Challenge</div>
            </div>
            <BingoBanner card={card} onOpen={() => setOpen(true)} />
            {open && <BingoModal card={card} onClose={() => setOpen(false)} />}
          </div>
        </window.IOSDevice>
      </window.ThemeContext.Provider>
    );
  }

  function Showcase() {
    return (
      <React.Fragment>
        <div className="row-label">Modal · Dark · Light</div>
        <div className="row">
          <div className="frame-wrap">
            <Demo theme="dark" startOpen={true} />
            <div className="frame-label">Bier-Bingo · modal</div>
          </div>
          <div className="frame-wrap">
            <Demo theme="light" startOpen={true} />
            <div className="frame-label">Bier-Bingo · modal</div>
          </div>
        </div>

        <div className="row-label" style={{ marginTop: 64 }}>Profile banner entry point</div>
        <div className="row">
          <div className="frame-wrap">
            <Demo theme="dark" startOpen={false} />
            <div className="frame-label">Banner · tap to open</div>
          </div>
          <div className="frame-wrap">
            <Demo theme="light" startOpen={false} />
            <div className="frame-label">Banner · tap to open</div>
          </div>
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Showcase />);
</script>
</body>
</html>
