<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pint — Login / Register</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e3d8; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 100vh; }
  body { padding: 40px 32px 80px; }
  .row { display: flex; align-items: flex-start; justify-content: flex-start; gap: 24px; flex-wrap: nowrap; overflow-x: auto; padding: 0 8px 28px; }
  .row + .row { margin-top: 40px; }
  .row-label {
    text-align: center; margin-bottom: 24px;
    color: #2a2a2a; font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-weight: 700;
    display: flex; align-items: center; gap: 14px; justify-content: center;
  }
  .row-label::before, .row-label::after {
    content: ""; flex: 1; max-width: 200px; height: 1px;
    background: rgba(0,0,0,0.15);
  }
  .frame-label {
    color: #555; font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
    text-align: center; margin-top: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 6px; text-align: center; }
  .intro { text-align: center; max-width: 680px; margin: 0 auto 36px; color: #444; font-size: 14px; line-height: 1.5; }
  .live-band { display: flex; justify-content: center; margin-bottom: 56px; }
</style>
</head>
<body>

<div class="intro">
  <h1>Pint. — Onboarding flow</h1>
  Welcome → email &amp; password → pick handle → done. The first frame below is live (click "Pour your first one" to walk it). The grid below pins each step in both themes.
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>

<script type="text/babel">
  const { AuthFlow, AuthStepFrame } = window;

  const steps = [
    { id: "welcome", label: "01 · Welcome" },
    { id: "phone",   label: "02 · Email & password" },
    { id: "handle",  label: "03 · Handle" },
    { id: "done",    label: "04 · You're in" },
  ];

  function Showcase() {
    return (
      <React.Fragment>
        <div className="row-label">Try the flow · click through</div>
        <div className="live-band">
          <div className="frame-wrap">
            <AuthFlow theme="dark" initialStep="welcome" />
            <div className="frame-label">Live flow · dark</div>
          </div>
        </div>

        <div className="row-label">Dark mode · each step</div>
        <div className="row">
          {steps.map(s => (
            <div key={`d-${s.id}`} className="frame-wrap">
              <AuthStepFrame theme="dark" which={s.id} />
              <div className="frame-label">{s.label}</div>
            </div>
          ))}
        </div>

        <div className="row-label">Light mode · each step</div>
        <div className="row">
          {steps.map(s => (
            <div key={`l-${s.id}`} className="frame-wrap">
              <AuthStepFrame theme="light" which={s.id} />
              <div className="frame-label">{s.label}</div>
            </div>
          ))}
        </div>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Showcase />);
</script>
</body>
</html>
